[package]
name = "bolina-daemon"
version = "0.1.0"
edition = "2021"
authors = ["Andres Palumbo <andrespalumbo311@gmail.com>"]
description = "Cloud-native hardware sensors, auto-rotation, and session helper daemon for Bolina OS"
license = "Apache-2.0"

[lib]
name = "bolina_daemon_lib"
path = "src/lib.rs"

[[bin]]
name = "bolina-daemon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inotify = { version = "0.11", default-features = false }
nix = { version = "0.31", features = ["fs"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
