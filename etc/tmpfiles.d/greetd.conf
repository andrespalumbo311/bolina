# Create the greetd home and state directories
d /var/lib/greetd 0750 greetd greetd - -
d /var/lib/greetd/.cache 0750 greetd greetd - -

# Linger for user-level services if needed
d /var/lib/systemd/linger 0755 root root - -
f /var/lib/systemd/linger/greetd 0644 root root - -

# Ensure dms-greeter cache directory always retains correct permissions for greetd daemon
d /var/cache/dms-greeter 0775 greetd greetd - -
Z /var/cache/dms-greeter 0775 greetd greetd - -
