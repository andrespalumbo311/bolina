container_additional_volumes="/var/data:/var/data:rw"

# Isolate fontconfig cache only during container creation to avoid polluting host cache.
# distrobox-enter also sources distrobox.conf, but 'podman exec' rejects create-time flags like --tmpfs.
case "${0##*/}" in
	distrobox-create*|distrobox-ephemeral*)
		container_manager_additional_flags="--tmpfs ${HOME}/.cache/fontconfig:rw"
		;;
esac
