[preferred]
# Fallback a catena: GNOME prima (più interfacce), poi GTK
default=gnome;gtk;

# ScreenCast e Screenshot → WLR (backend nativo per niri/wlroots)
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

# RemoteDesktop e InputCapture → GNOME (fornisce l'implementazione del portale di input per Valent)
org.freedesktop.impl.portal.RemoteDesktop=gnome
org.freedesktop.impl.portal.InputCapture=gnome

# FileChooser → GTK (evita Nautilus come picker predefinito)
org.freedesktop.impl.portal.FileChooser=gtk

# Access e Notification → GTK (più leggero, sufficiente)
org.freedesktop.impl.portal.Access=gtk
org.freedesktop.impl.portal.Notification=gtk

# Secret → gnome (fornisce l'implementazione del Secret portal tramite gnome-keyring)
org.freedesktop.impl.portal.Secret=gnome

# Settings → GNOME (tema, font scaling, preferenze di sistema)
org.freedesktop.impl.portal.Settings=gnome
