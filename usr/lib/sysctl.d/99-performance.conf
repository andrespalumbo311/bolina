# Swappiness ottimizzato per ZRAM (comprime pagine anonime inattive preservando la cache dei file)
vm.swappiness = 130
vm.vfs_cache_pressure = 50
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.max_map_count = 2147483642
# Disabilita penalità split-lock del kernel (necessario per prevenire micro-stutter e cali FPS nel JIT di Dolphin/Wine)
kernel.split_lock_mitigate = 0

