# Abilita l'algoritmo di congestione TCP BBR
net.ipv4.tcp_congestion_control = bbr
# Usa Cake per la gestione avanzata delle code (Smart Queue Management)
net.core.default_qdisc = cake
# Abilita TCP Fast Open (client + server) per ridurre di un RTT la latenza di handshake web
net.ipv4.tcp_fastopen = 3
# Mantiene la finestra di congestione dopo inattività evitando cali di throughput
net.ipv4.tcp_slow_start_after_idle = 0
